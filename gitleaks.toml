# gitleaks.toml
title = "VulnGraph Gitleaks Config"
useDefault = true
[allowlist]
paths = [
  ''':.*\.venv.*''',
  ''':.*\.git.*''',
  ''':.*tools.*''',
  ''':.*data.*''',
  ''':.*tmp.*''',
  ''':.*node_modules.*'''
]

[[rules]]
id = "test-api-key"
description = "Fake test API key"
regex = '''(?i)(api[_-]?key|token|secret)\s*=\s*["']sk-[a-zA-Z0-9]{20,}["']'''
tags = ["test"]

[[rules]]
id = "huggingface-token"
description = "HuggingFace API token"
regex = '''hf_[a-zA-Z0-9]{30,}'''
tags = ["huggingface", "api-key"]

[[rules]]
id = "generic-api-token"
description = "Generic API token in env files"
regex = '''(?i)(token|key|secret|password)\s*=\s*["'][a-zA-Z0-9_\-]{20,}["']'''
tags = ["generic"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "api-key"]